<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STEEP 시나리오 플래닝 워크숍</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2129;
    --panel-2: #222b35;
    --line: #2e3a47;
    --text: #e6edf3;
    --muted: #8b97a3;
    --accent: #4f9cf9;
    --accent-2: #7c5cff;
    --ok: #34c77b;
    --warn: #f0a93b;
    --danger: #f06363;
    /* STEEP colors */
    --c-S: #f06292;
    --c-T: #4f9cf9;
    --c-E1: #34c77b; /* Economic */
    --c-E2: #8bc34a; /* Environmental */
    --c-P: #f0a93b;
    --c-U: #8b97a3;  /* 미분류 */
    --radius: 12px;
    --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
                 "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #1c2733 0%, var(--bg) 55%);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  a { color: var(--accent); }
  button { font-family: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 18px 18px 80px; }

  /* Header */
  header.top {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 50;
    background: rgba(15,20,25,.85); backdrop-filter: blur(8px);
  }
  .logo { font-weight: 800; letter-spacing: .5px; font-size: 18px; }
  .logo .dot { color: var(--accent); }
  .top .spacer { flex: 1; }
  .top .meta { color: var(--muted); font-size: 13px; }
  .btn {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 8px 14px; border-radius: 9px; cursor: pointer; font-size: 14px;
    transition: .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: linear-gradient(180deg, #4f9cf9, #3d7fd6); border-color: transparent; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* Stepper */
  .stepper { display: flex; gap: 6px; flex-wrap: wrap; margin: 22px 0 24px; }
  .step {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
    color: var(--muted); cursor: pointer; font-size: 13px; transition: .15s;
  }
  .step .num {
    width: 22px; height: 22px; border-radius: 50%; background: var(--panel-2);
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .step.active { color: var(--text); border-color: var(--accent); background: #16222f; }
  .step.active .num { background: var(--accent); color: #fff; }
  .step.done .num { background: var(--ok); color: #fff; }

  /* Panels */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .panel + .panel { margin-top: 18px; }
  h2.title { margin: 0 0 4px; font-size: 22px; }
  .subtitle { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px){ .grid2 { grid-template-columns: 1fr; } .stepper{ font-size:12px } }

  label.fl { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  input[type=text], input[type=password], input[type=number], textarea, select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); border-radius: 9px; padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 92px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .field { margin-bottom: 14px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }

  /* Variable list */
  .var-row { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); margin-bottom: 10px; }
  .var-row .vtext { flex: 1; }
  .var-row .vtext .vt-main { font-size: 15px; }
  .var-row .vtext .vt-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #0b0f14; }
  .pill-S{background:var(--c-S)} .pill-T{background:var(--c-T)} .pill-Ec{background:var(--c-E1)}
  .pill-En{background:var(--c-E2)} .pill-P{background:var(--c-P)} .pill-U{background:var(--c-U)}

  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip-btn { font-size:11.5px; padding:4px 9px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer; }
  .chip-btn.sel { color:#0b0f14; font-weight:700; border-color:transparent; }

  /* STEEP board (columns) */
  .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  @media (max-width: 900px){ .board { grid-template-columns: 1fr 1fr; } }
  .col { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; min-height: 120px; padding: 10px; }
  .col h3 { margin: 0 0 4px; font-size: 14px; display:flex; align-items:center; gap:7px; }
  .col .cnt { color: var(--muted); font-size: 12px; }
  .col .desc { color: var(--muted); font-size: 11.5px; margin: 0 0 10px; }
  .col.dragover { border-color: var(--accent); background: #16222f; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; cursor: grab; font-size: 13px; }
  .card:active { cursor: grabbing; }
  .card .rat { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .dotbar { height: 4px; border-radius: 4px; margin-top: 7px; background: var(--line); position: relative; overflow:hidden;}
  .dotbar > i { position:absolute; left:0; top:0; bottom:0; }

  /* Evaluate table */
  table.eval { width: 100%; border-collapse: collapse; }
  table.eval th, table.eval td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
  table.eval th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  .scorecell { display:flex; align-items:center; gap:10px; }
  input[type=range]{ width: 130px; accent-color: var(--accent); }
  .scoreval { width: 26px; text-align:center; font-weight:700; }

  /* Matrix */
  .matrix-wrap { display:grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }
  @media (max-width: 880px){ .matrix-wrap{ grid-template-columns: 1fr; } }
  svg.matrix { width: 100%; height: auto; background: var(--panel-2); border-radius: 10px; border:1px solid var(--line); }
  .legend-list { font-size: 13px; }
  .legend-list .li { display:flex; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); align-items:center;}
  .legend-list .num { width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#0b0f14;flex:none;}

  .quad-box { border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--panel-2); }
  .quad-box h4 { margin:0 0 6px; font-size:13.5px; }
  .quad-box ul { margin:0; padding-left:18px; font-size:13px; color: var(--muted); }

  /* scenario */
  .scenario-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  @media (max-width:720px){ .scenario-grid{ grid-template-columns:1fr; } }
  .scn { border:1px solid var(--line); border-radius:10px; padding:14px; background:var(--panel-2); }
  .scn .hd { font-weight:700; margin-bottom:6px; }

  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-top: 20px; justify-content: space-between; align-items:center; }
  .toolbar .left, .toolbar .right { display:flex; gap:10px; flex-wrap:wrap; }

  .notice { font-size:13px; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); margin-bottom:14px;}
  .notice.warn { border-color:#5a4320; background:#241c0e; color:#f0c98b; }
  .notice.ok { border-color:#1f4d36; background:#0f241a; color:#9be3bf; }

  .spinner { display:inline-block; width:15px;height:15px;border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .hidden { display:none !important; }
  .row-actions { display:flex; gap:6px; }
  .kbd { font-family: ui-monospace, monospace; background: var(--panel-2); padding: 1px 6px; border-radius: 5px; border:1px solid var(--line); font-size:12px;}

  /* modal */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:grid; place-items:center; z-index:100; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; width:min(520px,92vw); box-shadow:var(--shadow);}
  .modal h3 { margin:0 0 12px; }

  footer.foot { text-align:center; color:var(--muted); font-size:12px; margin-top:30px; }
  .badge-count { background: var(--accent); color:#fff; border-radius:999px; padding:1px 8px; font-size:12px; }
</style>
</head>
<body>
<header class="top">
  <div class="logo">STEEP<span class="dot">.</span> 시나리오 플래닝</div>
  <div class="spacer"></div>
  <div class="meta" id="sessionMeta">새 세션</div>
  <button class="btn sm ghost" id="btnSettings">⚙ AI 설정</button>
  <button class="btn sm ghost" id="btnImport">불러오기</button>
  <button class="btn sm ghost" id="btnExportAll">전체 저장(JSON)</button>
</header>

<div class="wrap">
  <div class="stepper" id="stepper"></div>
  <div id="view"></div>
  <footer class="foot">
    데이터는 이 브라우저에 자동 저장됩니다 · 단계별로 CSV / 이미지 / JSON 추출 가능 ·
    조원별 JSON을 <span class="kbd">불러오기 → 병합</span>으로 취합하세요
  </footer>
</div>

<!-- file input (hidden) -->
<input type="file" id="fileInput" accept="application/json" class="hidden" />
<input type="file" id="mergeInput" accept="application/json" class="hidden" multiple />

<script>
/* =========================================================================
   STEEP 시나리오 플래닝 워크숍 도구
   - 단일 파일, 빌드 불필요, 오프라인 동작 (localStorage 자동 저장)
   - Claude API 키 입력 시 변수 자동 STEEP 분류
   ========================================================================= */

const STEEP = {
  S:  { key:'S',  name:'사회 (Social)',         pill:'pill-S',  color:'var(--c-S)',  hex:'#f06292',
        desc:'인구·문화·가치관·라이프스타일·소비자 행동' },
  T:  { key:'T',  name:'기술 (Technological)',  pill:'pill-T',  color:'var(--c-T)',  hex:'#4f9cf9',
        desc:'기술혁신·R&D·자동화·디지털 전환·특허' },
  Ec: { key:'Ec', name:'경제 (Economic)',       pill:'pill-Ec', color:'var(--c-E1)', hex:'#34c77b',
        desc:'경기·금리·환율·물가·고용·산업구조' },
  En: { key:'En', name:'환경 (Environmental)',  pill:'pill-En', color:'var(--c-E2)', hex:'#8bc34a',
        desc:'기후·자원·규제·ESG·지속가능성' },
  P:  { key:'P',  name:'정치 (Political)',       pill:'pill-P',  color:'var(--c-P)',  hex:'#f0a93b',
        desc:'정책·규제·세제·지정학·정부 안정성' },
  U:  { key:'U',  name:'미분류',                pill:'pill-U',  color:'var(--c-U)',  hex:'#8b97a3',
        desc:'아직 분류되지 않음' },
};
const STEEP_ORDER = ['S','T','Ec','En','P'];

const DEFAULT_STATE = () => ({
  v: 3,
  session: { teamName:'', topic:'', horizon:'', author:'', createdAt: Date.now() },
  variables: [],   // {id, text, category, aiName, rationale, impact(0|1-5), uncertainty(0|1-5), author}
  scenario: { axisX:'', axisY:'', xPos:'', xNeg:'', yPos:'', yNeg:'', cells:['','','',''] },
  settings: { model:'claude-sonnet-4-6' }, // apiKey stored separately (not exported)
  step: 0,
});

const STEPS = [
  { t:'1. 세션 설정', r: renderSetup },
  { t:'2. 변수 입력', r: renderInput },
  { t:'3. AI STEEP 분류', r: renderClassify },
  { t:'4. 영향도·불확실성 평가', r: renderEvaluate },
  { t:'5. 우선순위 매트릭스', r: renderMatrix },
  { t:'6. 시나리오 도출', r: renderScenario },
  { t:'7. 내보내기', r: renderExport },
];

const LS_KEY = 'steep_scenario_state_v3';
const LS_APIKEY = 'steep_anthropic_key';

let state = load();

function load(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ return Object.assign(DEFAULT_STATE(), JSON.parse(raw)); }
  } catch(e){ console.warn('load failed', e); }
  return DEFAULT_STATE();
}
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  updateMeta();
}
function getApiKey(){ return localStorage.getItem(LS_APIKEY) || ''; }
function setApiKey(k){ k ? localStorage.setItem(LS_APIKEY,k) : localStorage.removeItem(LS_APIKEY); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- chrome ---------- */
function updateMeta(){
  const s = state.session;
  const n = state.variables.length;
  document.getElementById('sessionMeta').textContent =
    (s.teamName ? s.teamName+' · ' : '') + (s.topic || '주제 미설정') + ' · 변수 '+n+'개';
}
function renderStepper(){
  const el = document.getElementById('stepper');
  el.innerHTML = STEPS.map((s,i)=>{
    const cls = i===state.step ? 'active' : (i<state.step ? 'done':'');
    return `<div class="step ${cls}" data-step="${i}"><span class="num">${i<state.step?'✓':i+1}</span>${esc(s.t.replace(/^\d+\.\s/,''))}</div>`;
  }).join('');
  el.querySelectorAll('.step').forEach(n=> n.onclick=()=>goto(+n.dataset.step));
}
function goto(i){ state.step = Math.max(0, Math.min(STEPS.length-1, i)); save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function render(){ renderStepper(); document.getElementById('view').innerHTML=''; STEPS[state.step].r(document.getElementById('view')); updateMeta(); }

function navButtons(){
  const prev = state.step>0 ? `<button class="btn ghost" onclick="goto(${state.step-1})">← 이전</button>`:'<span></span>';
  const next = state.step<STEPS.length-1 ? `<button class="btn primary" onclick="goto(${state.step+1})">다음 →</button>`:'';
  return `<div class="toolbar"><div class="left">${prev}</div><div class="right">${next}</div></div>`;
}

/* =================== STEP 1: SETUP =================== */
function renderSetup(root){
  const s = state.session;
  root.innerHTML = `
  <div class="panel">
    <h2 class="title">세션 설정</h2>
    <p class="subtitle">워크숍의 분석 대상과 시간 지평을 정의합니다. 조 이름과 작성자를 적으면 추후 취합 시 출처를 구분할 수 있어요.</p>
    <div class="grid2">
      <div class="field"><label class="fl">조 / 팀 이름</label><input type="text" id="f_team" value="${esc(s.teamName)}" placeholder="예: 1조 - 신사업 TF"></div>
      <div class="field"><label class="fl">작성자 (선택)</label><input type="text" id="f_author" value="${esc(s.author)}" placeholder="예: 홍길동"></div>
    </div>
    <div class="field"><label class="fl">분석 대상 / 핵심 질문 (사업 환경)</label>
      <input type="text" id="f_topic" value="${esc(s.topic)}" placeholder="예: 2030년 국내 전기차 충전 인프라 사업의 미래"></div>
    <div class="grid2">
      <div class="field"><label class="fl">시간 지평 (Time Horizon)</label><input type="text" id="f_hz" value="${esc(s.horizon)}" placeholder="예: 향후 5년 (~2030)"></div>
    </div>
    <div class="notice">💡 <b>STEEP</b> = Social(사회) · Technological(기술) · Economic(경제) · Environmental(환경) · Political(정치). 거시 환경을 5개 렌즈로 스캔하는 프레임워크입니다.</div>
    <div class="toolbar"><div class="left">
      <button class="btn danger ghost" id="btnReset">세션 초기화</button>
    </div><div class="right">
      <button class="btn primary" id="btnSaveSetup">저장하고 시작 →</button>
    </div></div>
  </div>`;
  const sv = ()=>{ s.teamName=val('f_team'); s.author=val('f_author'); s.topic=val('f_topic'); s.horizon=val('f_hz'); save(); };
  ['f_team','f_author','f_topic','f_hz'].forEach(id=> document.getElementById(id).addEventListener('input', sv));
  document.getElementById('btnSaveSetup').onclick = ()=>{ sv(); goto(1); };
  document.getElementById('btnReset').onclick = ()=>{
    if(confirm('현재 세션의 모든 데이터를 삭제하고 새로 시작할까요?')){ state = DEFAULT_STATE(); save(); render(); }
  };
}
function val(id){ return document.getElementById(id).value.trim(); }

/* =================== STEP 2: INPUT =================== */
function renderInput(root){
  root.innerHTML = `
  <div class="panel">
    <h2 class="title">변수 입력</h2>
    <p class="subtitle">사업 환경에 영향을 미칠 것 같은 요인/변수를 적어주세요. 한 줄에 하나씩 직접 입력하거나, <b>구글 시트에서 복사한 표를 그대로 붙여넣을</b> 수 있습니다. (분류는 다음 단계에서 AI가 정리합니다.)</p>
    <div class="notice">📋 <b>구글 시트로 취합하기</b>: 조원들이 공유 시트의 <span class="kbd">변수 · 작성자 · 영향도 · 불확실성</span> 열에 입력 → 진행자가 그 범위를 복사해 아래에 붙여넣으면 <b>작성자·점수까지 자동 인식</b>됩니다. (탭 구분 표 감지)</div>
    <div class="field">
      <textarea id="bulk" placeholder="① 직접 입력 — 한 줄에 변수 하나
고령화로 인한 노동인구 감소
생성형 AI의 빠른 보급

② 또는 구글 시트에서 복사한 표 붙여넣기 (탭 구분, 헤더 행은 자동 무시)
변수	작성자	영향도	불확실성
고령화로 인한 노동인구 감소	홍길동	4	3
탄소국경세 도입	김철수	5	5"></textarea>
      <div class="hint">표를 붙여넣으면 열 순서 <b>변수 → 작성자 → 영향도(1-5) → 불확실성(1-5)</b> 로 읽습니다. 변수 텍스트만 있는 줄은 그대로 추가됩니다.</div>
    </div>
    <div class="toolbar"><div class="left">
      <button class="btn primary" id="btnAdd">＋ 변수 추가</button>
      <button class="btn ghost" id="btnSample">예시 채우기</button>
      <button class="btn ghost" id="btnCopyHeader">📋 시트 헤더 복사</button>
    </div><div class="right">
      <span class="meta">총 <span class="badge-count" id="cnt">${state.variables.length}</span> 개</span>
    </div></div>
  </div>
  <div class="panel">
    <h3 style="margin:0 0 12px">입력된 변수 목록</h3>
    <div id="varList"></div>
  </div>
  ${navButtons()}`;

  document.getElementById('btnAdd').onclick = ()=>{
    const items = parseBulk(document.getElementById('bulk').value);
    if(!items.length){ return; }

/* 표(탭 구분) 또는 줄 단위 입력을 파싱.
   표 모드 열 순서: 변수 / 작성자 / 영향도(1-5) / 불확실성(1-5) */
function parseBulk(raw){
  const rows = (raw||'').split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim().length);
  const tableMode = rows.some(l=>l.includes('\t'));
  const items=[];
  rows.forEach((line, idx)=>{
    if(tableMode){
      const cols = line.split('\t').map(c=>c.trim());
      const text = cols[0]||'';
      if(!text) return;
      // 첫 행이 헤더(변수/작성자/영향도… 텍스트, 점수 없음)면 무시
      const looksHeader = idx===0 && /^(변수|항목|요인|내용|factor|variable)/i.test(text)
                          && scoreOf(cols[2])===0 && scoreOf(cols[3])===0;
      if(looksHeader) return;
      items.push({ text, author: cols[1]||'', impact: scoreOf(cols[2]), uncertainty: scoreOf(cols[3]) });
    } else {
      const text=line.trim();
      if(text) items.push({ text, author:'', impact:0, uncertainty:0 });
    }
  });
  return items;
}
function scoreOf(s){ const n=parseInt(s,10); return (n>=1 && n<=5) ? n : 0; }
const SAMPLE = ['고령화로 인한 생산가능인구 감소','MZ세대의 가치소비 확산','생성형 AI의 업무 자동화 가속',

/* ----- rule-based fallback classifier ----- */
const RULES = {
  S: ['인구','고령','세대','소비자','문화','가치','라이프','웰빙','교육','건강','도시화','노동인구','출산','이민','트렌드','소비'],
  T: ['기술','ai','인공지능','디지털','자동화','로봇','데이터','특허','혁신','플랫폼','배터리','반도체','클라우드','5g','6g','바이오','r&d'],
  Ec: ['경제','경기','금리','환율','물가','인플레','고용','임금','소득','투자','산업','시장','공급망','수출','수입','가격','자본','부채','성장률'],
  En: ['환경','기후','탄소','온실','에너지','재생','자원','오염','esg','지속가능','친환경','폐기물','수자원','생태','날씨','재난'],
  P: ['정치','정책','규제','법','세제','세금','정부','선거','지정학','무역갈등','제재','관세','외교','전쟁','안보','보조금','샌드박스'],
};
function ruleClassify(){
  state.variables.forEach(v=>{
    if(v.category!=='U') return;
    const t = (v.text||'').toLowerCase();
    let best='U', score=0;
    for(const k of STEEP_ORDER){
      const s = RULES[k].reduce((a,w)=> a + (t.includes(w)?1:0), 0);
      if(s>score){ score=s; best=k; }
    }
    if(best!=='U'){ v.category=best; v.rationale = v.rationale||'(규칙 기반 추정)'; }
  });
}

async function callClaude(system, user, maxTokens){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': getApiKey(),
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify({
      model: state.settings.model || 'claude-sonnet-4-6',
      max_tokens: maxTokens||2000,
      system,
      messages:[{role:'user', content:user}],
    }),
  });
  if(!res.ok){
    let msg = res.status+' '+res.statusText;
    try { const e = await res.json(); if(e.error?.message) msg = e.error.message; } catch(_){}
    throw new Error(msg);
  }
  return res.json();
}
function extractJSON(text){
  if(!text) return null;
  let t = text.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  const s = t.indexOf('{'), e = t.lastIndexOf('}');
  if(s>=0 && e>s) t = t.slice(s, e+1);
  try { return JSON.parse(t); } catch(_){ return null; }
}

function scoredVars(){ return state.variables.filter(v=>v.impact>0 && v.uncertainty>0); }

function drawMatrix(){
  const host = document.getElementById('matrixHost'); if(!host) return;
  const vars = scoredVars();
  const W=520, H=480, pad=54;
  const x = u => pad + (u-1)/4*(W-pad*2);          // uncertainty 1..5 -> x
  const y = i => (H-pad) - (i-1)/4*(H-pad*2);       // impact 1..5 -> y (up)
  const mid = 3;
  // jitter overlapping points
  const seen={};
  function jit(v){ const k=v.uncertainty+'_'+v.impact; const n=(seen[k]=(seen[k]||0)+1); const ang=n*1.6; return {dx:Math.cos(ang)*7*(n>1?1:0), dy:Math.sin(ang)*7*(n>1?1:0)}; }

  const pts = vars.map((v,idx)=>{
    const j=jit(v); const c=STEEP[v.category]||STEEP.U;
    return `<g>
      <circle cx="${x(v.uncertainty)+j.dx}" cy="${y(v.impact)+j.dy}" r="13" fill="${c.hex}" fill-opacity="0.9" stroke="#0b0f14" stroke-width="1.5"></circle>
      <text x="${x(v.uncertainty)+j.dx}" y="${y(v.impact)+j.dy+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0f14">${idx+1}</text>
    </g>`;
  }).join('');

  const svg = `<svg class="matrix" viewBox="0 0 ${W} ${H}" id="matrixSvg" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#222b35"></rect>
    <!-- quadrant shading -->
    <rect x="${x(mid)}" y="${pad}" width="${(W-pad)-x(mid)}" height="${y(mid)-pad}" fill="#4f9cf9" fill-opacity="0.08"></rect>
    <!-- axes -->
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#5a6675" stroke-width="1.5"></line>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#5a6675" stroke-width="1.5"></line>
    <line x1="${x(mid)}" y1="${pad}" x2="${x(mid)}" y2="${H-pad}" stroke="#3a4654" stroke-dasharray="5 5"></line>
    <line x1="${pad}" y1="${y(mid)}" x2="${W-pad}" y2="${y(mid)}" stroke="#3a4654" stroke-dasharray="5 5"></line>
    <!-- labels -->
    <text x="${(W)/2}" y="${H-16}" text-anchor="middle" fill="#8b97a3" font-size="13" font-weight="700">불확실성 (Uncertainty) →</text>
    <text x="18" y="${H/2}" text-anchor="middle" fill="#8b97a3" font-size="13" font-weight="700" transform="rotate(-90 18 ${H/2})">영향도 (Impact) →</text>
    <text x="${W-pad-6}" y="${pad+16}" text-anchor="end" fill="#4f9cf9" font-size="12" font-weight="700">핵심 불확실성</text>
    <text x="${pad+6}" y="${pad+16}" fill="#6f7c8a" font-size="11">핵심 동인</text>
    <text x="${W-pad-6}" y="${H-pad-8}" text-anchor="end" fill="#6f7c8a" font-size="11">모니터링</text>
    <text x="${pad+6}" y="${H-pad-8}" fill="#6f7c8a" font-size="11">부차 요인</text>
    ${pts}
  </svg>`;
  host.innerHTML = svg;

  // legend + quadrant lists
  const buckets={crit:[],driver:[],monitor:[],low:[]};
  vars.forEach((v,idx)=>{
    const hiI=v.impact>=mid, hiU=v.uncertainty>=mid;
    const item={...v, n:idx+1};
    if(hiI&&hiU) buckets.crit.push(item);
    else if(hiI&&!hiU) buckets.driver.push(item);
    else if(!hiI&&hiU) buckets.monitor.push(item);
    else buckets.low.push(item);
  });
  const li = arr => arr.length? arr.map(v=>`<li><b>${v.n}.</b> ${esc(v.aiName||v.text)} <span class="meta">(I${v.impact}/U${v.uncertainty})</span></li>`).join('') : '<li class="meta">없음</li>';
  setHTML('qCritical', buckets.crit.length? buckets.crit.sort((a,b)=>(b.impact+b.uncertainty)-(a.impact+a.uncertainty)).map(v=>`<li><b>${v.n}.</b> ${esc(v.aiName||v.text)} <span class="meta">(I${v.impact}/U${v.uncertainty})</span></li>`).join('') : '<li class="meta">아직 없음 — 영향도·불확실성을 평가하세요</li>');
  setHTML('qDriver', li(buckets.driver));
  setHTML('qMonitor', li(buckets.monitor));
  setHTML('qLow', li(buckets.low));
}
function setHTML(id,h){ const e=document.getElementById(id); if(e) e.innerHTML=h; }

function exportMatrixPNG(){
  const svg = document.getElementById('matrixSvg'); if(!svg) return;
  const xml = new XMLSerializer().serializeToString(svg);
  const img = new Image();
  const svg64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
  img.onload = ()=>{
    const scale=2; const cv=document.createElement('canvas');
    cv.width = svg.viewBox.baseVal.width*scale; cv.height = svg.viewBox.baseVal.height*scale;
    const ctx=cv.getContext('2d'); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
    cv.toBlob(b=> downloadBlob(b, fname('matrix','png')));
  };
  img.src = svg64;
}

async function aiGenScenarios(){
  const key=getApiKey(); const out=document.getElementById('scnAi'); const sc=state.scenario;
  if(!key){ openSettings(); return; }
  if(!sc.axisX||!sc.axisY){ out.innerHTML=`<div class="notice warn">먼저 X·Y 축을 지정하세요.</div>`; return; }
  out.innerHTML=`<div class="notice"><span class="spinner"></span> AI가 4개 시나리오 초안을 작성 중…</div>`;
  const sys=`당신은 시나리오 플래닝 전문가입니다. 2개의 핵심 불확실성 축으로 만든 2x2 매트릭스의 4개 사분면에 대해 각각 미래 시나리오를 작성하세요.
각 시나리오는 (1)임팩트 있는 이름 (2)2~3문장 상황 묘사 (3)사업 시사점/대응 1문장을 포함하고 한국어로 작성.
JSON만 출력: {"cells":["사분면1 텍스트","사분면2","사분면3","사분면4"]}
사분면 순서: 1=(X−,Y+) 2=(X+,Y+) 3=(X−,Y−) 4=(X+,Y−)`;
  const usr=`분석 대상: ${state.session.topic||'(미지정)'} / 지평: ${state.session.horizon||''}
가로축(X): ${sc.axisX} [− ${sc.xNeg||'?'} ~ + ${sc.xPos||'?'}]
세로축(Y): ${sc.axisY} [− ${sc.yNeg||'?'} ~ + ${sc.yPos||'?'}]`;
  try{
    const data=await callClaude(sys,usr,2500);
    const text=(data.content||[]).map(b=>b.text||'').join('');
    const json=extractJSON(text); if(!json||!json.cells) throw new Error('파싱 실패');
    sc.cells = json.cells.slice(0,4); save(); renderScnGrid();
    out.innerHTML=`<div class="notice ok">✅ 초안을 채웠습니다. 팀 토론으로 다듬으세요.</div>`;
  }catch(e){ out.innerHTML=`<div class="notice warn">⚠ 실패: ${esc(e.message)}</div>`; }
}

/* ---------- merge ---------- */
function handleMerge(files){
  let added=0, done=0;
  const msg=document.getElementById('mergeMsg');
  const existing = new Set(state.variables.map(v=>(v.text||'').trim()));
  [...files].forEach(file=>{
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        (d.variables||[]).forEach(v=>{
          const t=(v.text||'').trim(); if(!t||existing.has(t)) return;
          existing.add(t);
          state.variables.push({ id:uid(), text:t, category:v.category||'U', aiName:v.aiName||'', rationale:v.rationale||'', impact:v.impact||0, uncertainty:v.uncertainty||0, author:v.author||(d.session?.teamName||'') });
          added++;
        });
      }catch(e){ console.warn('merge parse fail',e); }
      if(++done===files.length){ save(); if(msg) msg.textContent=` ✅ ${added}개 변수 병합 완료`; render(); }
    };
    r.readAsText(file);
  });
}

/* ---------- import / export-all ---------- */
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.variables) throw new Error('형식 오류');
      if(confirm('현재 세션을 불러온 데이터로 교체할까요? (병합이 아닌 교체)')){
        state = Object.assign(DEFAULT_STATE(), d); save(); render();
      }
    }catch(e){ alert('불러오기 실패: '+e.message); }
  };
  r.readAsText(file);
}

/* ---------- helpers ---------- */
function downloadBlob(blob, name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function fname(base,ext){
  const t=(state.session.teamName||'steep').replace(/[^\w가-힣]+/g,'_').slice(0,20);
  return `${t}_${base}_${new Date().toISOString().slice(0,10)}.${ext}`;
}

      <select id="m_model">
        <option value="claude-sonnet-4-6">claude-sonnet-4-6 (균형·추천)</option>
        <option value="claude-opus-4-8">claude-opus-4-8 (최고 성능)</option>
        <option value="claude-haiku-4-5-20251001">claude-haiku-4-5 (빠름·저비용)</option>
      </select>
    </div>
    <div class="notice">브라우저에서 직접 호출하므로 <span class="kbd">anthropic-dangerous-direct-browser-access</span> 헤더를 사용합니다. 개인/세미나용 키 사용을 권장합니다.</div>
    <div class="toolbar"><div class="left">
      <button class="btn ghost" id="m_clear">키 삭제</button>
    </div><div class="right">
      <button class="btn ghost" id="m_cancel">취소</button>
      <button class="btn primary" id="m_save">저장</button>
    </div></div>
  </div>`;
  document.body.appendChild(bg);
  document.getElementById('m_model').value = state.settings.model||'claude-sonnet-4-6';
  const close=()=>bg.remove();
  bg.addEventListener('click',e=>{ if(e.target===bg) close(); });
  document.getElementById('m_cancel').onclick=close;
  document.getElementById('m_clear').onclick=()=>{ setApiKey(''); close(); render(); };
  document.getElementById('m_save').onclick=()=>{
    setApiKey(document.getElementById('m_key').value.trim());
    state.settings.model=document.getElementById('m_model').value; save(); close(); render();
  };
}

/* ---------- top buttons ---------- */
document.getElementById('btnSettings').onclick=openSettings;
document.getElementById('btnExportAll').onclick=()=>exportJSON();
document.getElementById('btnImport').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=''; };
document.getElementById('mergeInput').onchange=e=>{ if(e.target.files.length) handleMerge(e.target.files); e.target.value=''; };

/* ---------- boot ---------- */
render();
</script>
</body>
</html>
