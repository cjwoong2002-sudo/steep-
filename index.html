<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 사업기회 도출 워크숍 — STEEP 시나리오 플래닝</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --panel-2: #222b35; --line: #2e3a47;
    --text: #e6edf3; --muted: #8b97a3; --accent: #4f9cf9; --accent-2: #7c5cff;
    --ok: #34c77b; --warn: #f0a93b; --danger: #f06363; --ai: #c084fc;
    --c-S: #f06292; --c-T: #4f9cf9; --c-Ec: #34c77b; --c-En: #8bc34a; --c-P: #f0a93b; --c-U: #8b97a3;
    --radius: 12px; --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
                 "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #1c2733 0%, var(--bg) 55%);
    color: var(--text); line-height: 1.5; min-height: 100vh;
  }
  a { color: var(--accent); }
  button { font-family: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 18px 90px; }

  header.top {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50;
    background: rgba(15,20,25,.88); backdrop-filter: blur(8px); flex-wrap: wrap;
  }
  .logo { font-weight: 800; letter-spacing: .3px; font-size: 17px; }
  .logo .dot { color: var(--accent); }
  .top .spacer { flex: 1; }
  .top .meta { color: var(--muted); font-size: 13px; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 8px 14px; border-radius: 9px; cursor: pointer; font-size: 14px; transition: .15s; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: linear-gradient(180deg, #4f9cf9, #3d7fd6); border-color: transparent; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ai { background: linear-gradient(180deg,#a855f7,#7c3aed); border-color:transparent; font-weight:600; }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .btn.tiny { padding: 3px 8px; font-size: 12px; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .stepper { display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0 22px; }
  .step { display: flex; align-items: center; gap: 8px; padding: 8px 13px; border: 1px solid var(--line);
    border-radius: 999px; background: var(--panel); color: var(--muted); cursor: pointer; font-size: 12.5px; transition: .15s; }
  .step .num { width: 21px; height: 21px; border-radius: 50%; background: var(--panel-2);
    display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .step.active { color: var(--text); border-color: var(--accent); background: #16222f; }
  .step.active .num { background: var(--accent); color: #fff; }
  .step.done .num { background: var(--ok); color: #fff; }
  .step.future { opacity: .55; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .panel + .panel { margin-top: 18px; }
  h2.title { margin: 0 0 4px; font-size: 22px; }
  h3.sec { margin: 26px 0 10px; font-size: 17px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .subtitle { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 720px){ .grid2,.grid3 { grid-template-columns: 1fr; } }

  label.fl { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  input[type=text], input[type=password], select, textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
  textarea { resize: vertical; min-height: 90px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .field { margin-bottom: 14px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }

  /* framework collapsible */
  details.fw { border:1px solid var(--accent); border-radius:10px; background:#13202d; margin-bottom:18px; overflow:hidden; }
  details.fw > summary { cursor:pointer; padding:12px 16px; font-weight:600; color:var(--accent); list-style:none; display:flex; align-items:center; gap:8px; }
  details.fw > summary::-webkit-details-marker { display:none; }
  details.fw > summary::before { content:'▸'; transition:.15s; }
  details.fw[open] > summary::before { transform:rotate(90deg); }
  details.fw .fw-body { padding: 4px 18px 18px; font-size:13.5px; color:#cdd7e1; }
  details.fw .fw-body h4 { margin:14px 0 6px; font-size:14px; color:var(--text); }
  details.fw .fw-body ul { margin:6px 0; padding-left:20px; }
  details.fw .fw-body li { margin:3px 0; }
  .fw-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:8px 0; }
  @media (max-width:760px){ .fw-grid{ grid-template-columns:1fr 1fr; } }
  .fw-cell { border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--panel); }
  .fw-cell b { display:block; margin-bottom:3px; }

  .notice { font-size:13px; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); margin-bottom:14px;}
  .notice.warn { border-color:#5a4320; background:#241c0e; color:#f0c98b; }
  .notice.ok { border-color:#1f4d36; background:#0f241a; color:#9be3bf; }
  .notice.ai { border-color:#5b3a7a; background:#1d1430; color:#d8b6ff; }

  .tag { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; color:#0b0f14; }
  .pill-S{background:var(--c-S)} .pill-T{background:var(--c-T)} .pill-Ec{background:var(--c-Ec)}
  .pill-En{background:var(--c-En)} .pill-P{background:var(--c-P)} .pill-U{background:var(--c-U)}
  .ai-tag { background:linear-gradient(90deg,#a855f7,#6366f1); color:#fff; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }

  .var-row { display:flex; gap:10px; align-items:flex-start; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--panel-2); margin-bottom:10px; }
  .var-row .vtext { flex:1; }
  .var-row .vt-main { font-size:15px; }
  .var-row .vt-sub { font-size:12.5px; color:var(--muted); margin-top:3px; }

  /* board */
  .board { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  @media (max-width:900px){ .board { grid-template-columns:1fr 1fr; } }
  .col { background:var(--panel-2); border:1px solid var(--line); border-radius:10px; min-height:120px; padding:10px; }
  .col h3 { margin:0 0 4px; font-size:14px; display:flex; align-items:center; gap:7px; }
  .col .cnt { color:var(--muted); font-size:12px; }
  .col .desc { color:var(--muted); font-size:11.5px; margin:0 0 10px; }
  .col.dragover { border-color:var(--accent); background:#16222f; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-bottom:8px; cursor:grab; font-size:13px; }
  .card:active { cursor:grabbing; }
  .card .rat { color:var(--muted); font-size:11.5px; margin-top:4px; }
  .card .cross { color:var(--ai); font-size:11.5px; margin-top:5px; border-top:1px dashed #3a3050; padding-top:5px; }

  table.eval { width:100%; border-collapse:collapse; }
  table.eval th, table.eval td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  table.eval th { color:var(--muted); font-weight:600; font-size:12.5px; }
  .scorecell { display:flex; align-items:center; gap:10px; }
  input[type=range]{ width:120px; accent-color:var(--accent); }
  .scoreval { width:24px; text-align:center; font-weight:700; }

  .matrix-wrap { display:grid; grid-template-columns:1.4fr 1fr; gap:18px; }
  @media (max-width:880px){ .matrix-wrap{ grid-template-columns:1fr; } }
  svg.matrix { width:100%; height:auto; background:var(--panel-2); border-radius:10px; border:1px solid var(--line); }
  .quad-box { border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--panel-2); }
  .quad-box h4 { margin:0 0 6px; font-size:13.5px; }
  .quad-box ul { margin:0; padding-left:18px; font-size:13px; color:var(--muted); }

  .scenario-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  @media (max-width:720px){ .scenario-grid{ grid-template-columns:1fr; } }
  .scn { border:1px solid var(--line); border-radius:10px; padding:14px; background:var(--panel-2); position:relative; }
  .scn.selected { border-color:var(--ok); box-shadow:0 0 0 1px var(--ok); }
  .scn .hd { font-weight:700; margin-bottom:6px; }
  .scn .pick { position:absolute; top:12px; right:12px; }

  /* BMC */
  .canvas-tabs { display:flex; gap:8px; margin-bottom:14px; }
  .canvas-tabs .tb { padding:8px 16px; border-radius:9px 9px 0 0; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); cursor:pointer; font-weight:600; }
  .canvas-tabs .tb.active { background:var(--accent); color:#fff; border-color:transparent; }
  .act3-layout { display:grid; grid-template-columns: 1fr 300px; gap:16px; align-items:start; }
  @media (max-width:980px){ .act3-layout{ grid-template-columns:1fr; } }
  .bmc { display:grid; grid-template-columns:repeat(10,1fr); grid-auto-rows:minmax(150px,auto); gap:8px; }
  .bmc .blk { border:1px solid var(--line); border-radius:9px; background:var(--panel-2); padding:9px; display:flex; flex-direction:column; }
  .bmc .blk h5 { margin:0 0 3px; font-size:12.5px; display:flex; align-items:center; gap:6px; }
  .bmc .blk .bq { font-size:10.5px; color:var(--muted); margin-bottom:6px; }
  .bmc .blk textarea { flex:1; min-height:64px; font-size:12.5px; padding:7px; }
  .bmc .blk .ai-mini { align-self:flex-end; margin-top:6px; }
  @media (max-width:860px){ .bmc { display:flex; flex-direction:column; } }
  .sidepanel { position:sticky; top:70px; border:1px solid var(--line); border-radius:10px; background:#13202d; padding:14px; font-size:13px; }
  .sidepanel h4 { margin:0 0 8px; font-size:13.5px; color:var(--accent); }
  .sidepanel .drv { padding:6px 0; border-bottom:1px dashed var(--line); }
  .sidepanel .scnbox { background:var(--panel-2); border:1px solid var(--ok); border-radius:8px; padding:10px; margin-bottom:12px; font-size:12.5px; }

  /* opp/threat */
  .ot-row { border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--panel-2); margin-bottom:12px; }
  .ot-row .ot-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { background:transparent; border:none; color:var(--muted); padding:6px 12px; cursor:pointer; font-size:12.5px; }
  .seg button.opp.on { background:var(--ok); color:#04130b; font-weight:700; }
  .seg button.threat.on { background:var(--danger); color:#1a0606; font-weight:700; }
  .seg button.none.on { background:var(--muted); color:#0b0f14; font-weight:700; }

  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; justify-content:space-between; align-items:center; }
  .toolbar .left, .toolbar .right { display:flex; gap:10px; flex-wrap:wrap; }
  .spinner { display:inline-block; width:15px; height:15px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden { display:none !important; }
  .kbd { font-family: ui-monospace, monospace; background:var(--panel-2); padding:1px 6px; border-radius:5px; border:1px solid var(--line); font-size:12px; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:grid; place-items:center; z-index:100; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; width:min(520px,92vw); box-shadow:var(--shadow); }
  .modal h3 { margin:0 0 12px; }
  footer.foot { text-align:center; color:var(--muted); font-size:12px; margin-top:30px; }
  .badge-count { background:var(--accent); color:#fff; border-radius:999px; padding:1px 8px; font-size:12px; }
  .row-actions { display:flex; gap:6px; }
</style>
</head>
<body>
<header class="top">
  <div class="logo">AI 사업기회 도출<span class="dot"> ·</span> STEEP 시나리오</div>
  <div class="spacer"></div>
  <div class="meta" id="sessionMeta"></div>
  <button class="btn sm ghost" id="btnSettings">⚙ AI 설정</button>
  <button class="btn sm ghost" id="btnImport">불러오기</button>
  <button class="btn sm ghost" id="btnExportAll">저장(JSON)</button>
</header>

<div class="wrap">
  <div class="stepper" id="stepper"></div>
  <div id="view"></div>
  <footer class="foot">
    데이터는 이 브라우저에 자동 저장됩니다 · 시간 지평: <b>향후 5년</b> 고정 ·
    Activity별 Output은 <b>Output 추출</b> 단계에서 PDF/JSON으로 다운로드
  </footer>
</div>

<input type="file" id="fileInput" accept="application/json" class="hidden" />
<input type="file" id="mergeInput" accept="application/json" class="hidden" multiple />

<script>
/* =========================================================================
   AI 사업기회 도출 워크숍 — STEEP 시나리오 플래닝 Tool
   LG그룹 임원 대상 / Kearney 퍼실리테이션 / 단일 HTML, 오프라인 동작
   ========================================================================= */

const TIME_HORIZON = '향후 5년';

const STEEP = {
  S:  { key:'S',  name:'사회 (Social)',        pill:'pill-S',  hex:'#f06292', desc:'인구·문화·가치관·라이프스타일·소비 행동' },
  T:  { key:'T',  name:'기술 (Technological)', pill:'pill-T',  hex:'#4f9cf9', desc:'기술혁신·R&D·자동화·디지털 전환·특허' },
  Ec: { key:'Ec', name:'경제 (Economic)',      pill:'pill-Ec', hex:'#34c77b', desc:'경기·금리·환율·물가·고용·산업구조' },
  En: { key:'En', name:'환경 (Environmental)', pill:'pill-En', hex:'#8bc34a', desc:'기후·자원·규제·ESG·지속가능성' },
  P:  { key:'P',  name:'정치 (Political)',      pill:'pill-P',  hex:'#f0a93b', desc:'정책·규제·세제·지정학·정부 안정성' },
  U:  { key:'U',  name:'미분류',               pill:'pill-U',  hex:'#8b97a3', desc:'아직 분류되지 않음' },
};
const STEEP_ORDER = ['S','T','Ec','En','P'];

/* 비즈니스 모델 캔버스 9블록 */
const BMC = [
  { k:'kp',   name:'핵심 파트너십', q:'누가 핵심 파트너·공급자인가?' },
  { k:'ka',   name:'핵심 활동',     q:'가치 전달에 필수적인 활동은?' },
  { k:'kr',   name:'핵심 자원',     q:'필수 자원(인적·물적·지적·재무)은?' },
  { k:'vp',   name:'가치 제안',     q:'고객에게 어떤 가치를 주는가?' },
  { k:'cr',   name:'고객 관계',     q:'고객과 어떤 관계를 맺는가?' },
  { k:'ch',   name:'채널',         q:'어떤 경로로 가치를 전달하는가?' },
  { k:'cs',   name:'고객 세그먼트', q:'누구를 위해 가치를 만드는가?' },
  { k:'cost', name:'비용 구조',     q:'핵심 비용 동인은?' },
  { k:'rs',   name:'수익원',        q:'고객은 무엇에 지불하는가?' },
];
const BMC_POS = {
  kp:'grid-column:1/3;grid-row:1/3', ka:'grid-column:3/5;grid-row:1/2', kr:'grid-column:3/5;grid-row:2/3',
  vp:'grid-column:5/7;grid-row:1/3', cr:'grid-column:7/9;grid-row:1/2', ch:'grid-column:7/9;grid-row:2/3',
  cs:'grid-column:9/11;grid-row:1/3', cost:'grid-column:1/6;grid-row:3/4', rs:'grid-column:6/11;grid-row:3/4',
};

/* =====================================================================
   ⬇⬇⬇ KEARNEY 예시(데모) 데이터 — 교체 지점 ⬇⬇⬇
   Kearney가 작성한 실제 샘플을 받으면 이 KEARNEY_EXAMPLE 객체만 교체하면 됩니다.
   (id는 'ex*'로 고정 — oppthreat의 sel/rat 키가 이 id를 참조)
   '세션 설정'의 [📖 Kearney 예시 불러오기] 버튼으로 로드됩니다.
   ===================================================================== */
const KEARNEY_EXAMPLE = {
  topic: '생활가전 사업의 AI 시대 대응 (~2030)',
  variables: [
    { id:'ex1', text:'생성형 AI 가전 UX 보편화', category:'T', aiName:'생성형 AI 기반 가전 UX 보편화', rationale:'온디바이스 AI가 제품 경험의 핵심으로 부상', aiLinked:true, crossImpact:'가사노동 행태(S)와 가정 전력 수요(En)에 파급', impact:5, uncertainty:4 },
    { id:'ex2', text:'AI 반도체·전력 비용 변동', category:'Ec', aiName:'AI 인프라(반도체·전력) 비용 변동', rationale:'AI 연산 비용이 제품 원가구조를 좌우', aiLinked:true, crossImpact:'데이터센터 에너지 소비(En)와 부품 공급(P)에 연쇄', impact:4, uncertainty:5 },
    { id:'ex3', text:'데이터 주권·AI 규제 강화', category:'P', aiName:'데이터 주권·AI 규제 강화', rationale:'각국 규제가 데이터 활용 범위를 제약', aiLinked:true, crossImpact:'개인화 기술(T)과 글로벌 판매(Ec)를 동시 제약', impact:4, uncertainty:5 },
    { id:'ex4', text:'1인·고령 가구 증가', category:'S', aiName:'1인·고령 가구 구조 변화', rationale:'가구 구조 변화로 제품 수요 패턴 이동', aiLinked:false, crossImpact:'', impact:4, uncertainty:2 },
    { id:'ex5', text:'에너지 효율 규제 강화', category:'En', aiName:'에너지 효율·환경 규제 강화', rationale:'친환경 규제가 제품 설계 제약', aiLinked:false, crossImpact:'', impact:3, uncertainty:3 },
    { id:'ex6', text:'구독·서비스형 가전 확산', category:'Ec', aiName:'구독·서비스형(XaaS) 가전 확산', rationale:'소유에서 구독으로 수익모델 전환', aiLinked:false, crossImpact:'', impact:4, uncertainty:4 },
    { id:'ex7', text:'스마트홈 플랫폼 주도권 경쟁', category:'T', aiName:'AI 스마트홈 플랫폼 주도권 경쟁', rationale:'AI 비서가 생태계 락인의 핵심', aiLinked:true, crossImpact:'플랫폼 락인(Ec)과 사용자 관계(S)를 재편', impact:5, uncertainty:4 },
    { id:'ex8', text:'미중 기술패권·공급망 재편', category:'P', aiName:'미중 기술패권·공급망 재편', rationale:'지정학 리스크가 부품 조달을 위협', aiLinked:false, crossImpact:'', impact:4, uncertainty:3 },

const DEFAULT_STATE = () => ({
  v: 4,
  session: { team:'1조', name:'', title:'', topic:'', createdAt: Date.now() },
  variables: [],   // {id,text,category,aiName,rationale,aiLinked,crossImpact,impact,uncertainty,author}
  scenario: { axisX:'', axisY:'', xPos:'', xNeg:'', yPos:'', yNeg:'', cells:['','','',''], selected:-1 },
  canvas: { asis:{}, tobe:{} },
  oppthreat: { sel:{}, rat:{}, insight:'' }, // sel[varId]='opp'|'threat'|'none', rat[varId]=text
  settings: { model:'claude-sonnet-4-6' },
  step: 0,
});

const STEPS = [
  { t:'세션 설정',                    r: renderSetup },
  { t:'Activity I · STEEP 변수',      r: renderActI },
  { t:'Activity II · 핵심변수·시나리오', r: renderActII },
  { t:'Activity III · 비즈니스 캔버스', r: renderActIII },
  { t:'Activity IV · 기회/위협',       r: renderActIV },
  { t:'Output 추출',                  r: renderOutput },
  { t:'2일차 (예정)',                 r: renderDay2, future:true },
];

const LS_KEY = 'steep_workshop_state_v4';
const LS_APIKEY = 'steep_anthropic_key';

let state = load();
if(state.step>=STEPS.length) state.step=0;

function load(){
  try { const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = Object.assign(DEFAULT_STATE(), JSON.parse(raw));
      d.canvas = Object.assign({asis:{},tobe:{}}, d.canvas||{});
      d.oppthreat = Object.assign({sel:{},rat:{},insight:''}, d.oppthreat||{});
      if(d.scenario && d.scenario.selected==null) d.scenario.selected=-1;
      return d; }
  } catch(e){ console.warn('load failed', e); }
  return DEFAULT_STATE();
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); updateMeta(); }
function getApiKey(){ return localStorage.getItem(LS_APIKEY) || ''; }
function setApiKey(k){ k ? localStorage.setItem(LS_APIKEY,k) : localStorage.removeItem(LS_APIKEY); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function val(id){ const e=document.getElementById(id); return e? e.value.trim():''; }

/* 직책(persona) 주입 — 모든 AI 추천/제안 프롬프트에 사용 */
function persona(){
  const t = state.session.title;
  return t ? `당신은 '${t}' 직책의 LG그룹 임원을 돕는 전략 컨설턴트입니다. 답변은 이 임원의 사업 관점에 맞춥니다. `
           : `당신은 LG그룹 임원을 돕는 전략 컨설턴트입니다. `;
}

/* ---------- chrome ---------- */
function updateMeta(){
  const s=state.session;
  document.getElementById('sessionMeta').textContent =
    [s.team, s.name, s.title].filter(Boolean).join(' · ') || '참가자 정보 미입력';
}
function renderStepper(){
  const el=document.getElementById('stepper');
  el.innerHTML = STEPS.map((s,i)=>{
    const cls=(i===state.step?'active':(i<state.step?'done':''))+(s.future?' future':'');
    return `<div class="step ${cls}" data-step="${i}"><span class="num">${i<state.step&&!s.future?'✓':(i)}</span>${esc(s.t)}</div>`;
  }).join('');
  el.querySelectorAll('.step').forEach(n=> n.onclick=()=>goto(+n.dataset.step));
}
function goto(i){ state.step=Math.max(0,Math.min(STEPS.length-1,i)); save(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function render(){ renderStepper(); const v=document.getElementById('view'); v.innerHTML=''; STEPS[state.step].r(v); updateMeta(); }
function navButtons(){
  const prev = state.step>0 ? `<button class="btn ghost" onclick="goto(${state.step-1})">← 이전</button>`:'<span></span>';
  const next = state.step<STEPS.length-1 ? `<button class="btn primary" onclick="goto(${state.step+1})">다음 →</button>`:'';
  return `<div class="toolbar"><div class="left">${prev}</div><div class="right">${next}</div></div>`;
}

function renderBoard(){
  const board=document.getElementById('board'); if(!board) return;
  board.innerHTML = STEEP_ORDER.map(k=>{
    const c=STEEP[k]; const items=state.variables.filter(v=>v.category===k);
    return `<div class="col" data-cat="${k}"><h3><span class="tag ${c.pill}">${c.name.split(' ')[0]}</span> <span class="cnt">${items.length}</span></h3>
      <p class="desc">${c.desc}</p><div class="col-body">${items.map(cardHTML).join('')}</div></div>`;
  }).join('');
  const un=state.variables.filter(v=>v.category==='U');
  if(un.length){
    const div=document.createElement('div'); div.style.gridColumn='1 / -1'; div.className='col'; div.dataset.cat='U';
    div.innerHTML=`<h3><span class="tag pill-U">미분류</span> <span class="cnt">${un.length}</span></h3>
      <p class="desc">아래 카드를 위 카테고리로 드래그하세요</p><div class="col-body">${un.map(cardHTML).join('')}</div>`;
    board.appendChild(div);
  }
  wireDnD();
  const u=document.getElementById('uncnt'); if(u) u.textContent=un.length;
}
function cardHTML(v){
  return `<div class="card" draggable="true" data-id="${v.id}">
    <div>${v.aiLinked?'<span class="ai-tag">⚡ AI 연계</span> ':''}${esc(v.aiName||v.text)}
      <button class="btn tiny danger ghost" data-del="${v.id}" style="float:right">×</button></div>
    ${v.aiName && v.aiName!==v.text ? `<div class="rat">원문: ${esc(v.text)}</div>`:''}
    ${v.rationale?`<div class="rat">↳ ${esc(v.rationale)}</div>`:''}
    ${v.crossImpact?`<div class="cross">⚡ 연쇄효과: ${esc(v.crossImpact)}</div>`:''}
  </div>`;
}
function wireDnD(){
  let dragId=null;
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('dragstart',e=>{ dragId=c.dataset.id; e.dataTransfer.effectAllowed='move'; });
  });
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave',()=> col.classList.remove('dragover'));
    col.addEventListener('drop',e=>{ e.preventDefault(); col.classList.remove('dragover');
      const v=state.variables.find(x=>x.id===dragId); if(v){ v.category=col.dataset.cat; save(); renderBoard(); } });
  });
  document.querySelectorAll('[data-del]').forEach(b=> b.onclick=(e)=>{ e.stopPropagation();
    state.variables=state.variables.filter(x=>x.id!==b.dataset.del); save(); renderBoard();
    const c=document.getElementById('cnt'); if(c) c.textContent=state.variables.length; });
}

  T:['기술','ai','인공지능','디지털','자동화','로봇','데이터','특허','혁신','플랫폼','배터리','반도체','클라우드','5g','6g','바이오','r&d','생성형'],
  Ec:['경제','경기','금리','환율','물가','인플레','고용','임금','소득','투자','산업','시장','공급망','수출','수입','가격','자본','부채','성장률'],
  En:['환경','기후','탄소','온실','에너지','재생','자원','오염','esg','지속가능','친환경','폐기물','수자원','생태','날씨','재난'],
  P:['정치','정책','규제','법','세제','세금','정부','선거','지정학','무역갈등','제재','관세','외교','전쟁','안보','보조금','샌드박스','주권'],
};
const AI_KW=['ai','인공지능','생성형','llm','머신러닝','딥러닝','자동화','로봇','알고리즘'];
function ruleClassify(){
  state.variables.forEach(v=>{
    const t=(v.text||'').toLowerCase();
    if(AI_KW.some(w=>t.includes(w))) v.aiLinked=true;
    if(v.category!=='U') return;
    let best='U',score=0;
    for(const k of STEEP_ORDER){ const s=RULES[k].reduce((a,w)=>a+(t.includes(w)?1:0),0); if(s>score){score=s;best=k;} }
    if(best!=='U'){ v.category=best; v.rationale=v.rationale||'(규칙 기반 추정)'; }
  });
}

async function runAIClassify(){
  const key=getApiKey(); const status=document.getElementById('aiStatus');
  if(!key){ openSettings(); return; }
  if(!state.variables.length) return;
  status.innerHTML=`<div class="notice ai"><span class="spinner"></span> Claude가 ${state.variables.length}개 변수를 분류 중…</div>`;
  const list=state.variables.map(v=>({id:v.id,text:v.text}));
  const sys=`${persona()}당신은 STEEP 거시환경 분석 전문 퍼실리테이터입니다. 사용자가 ${TIME_HORIZON} 사업환경 변수 목록을 줍니다.
각 변수를 한 글자 코드로 분류: S(사회) T(기술) Ec(경제) En(환경) P(정치).
또한 변수 표현을 분석 변수답게 간결히 다듬은 name과, 분류 근거 1문장 rationale을 작성하세요.
[중요] AI는 단일 기술 트렌드가 아니라 S/T/E/Ec/P 전 영역에 연쇄 영향을 미치는 범용 외생변수입니다.
- 변수가 AI와 직접 연관되면 aiLinked=true.
- aiLinked=true인 경우 crossImpact 필드에 'AI가 타 STEEP 영역에 미치는 연쇄효과'를 1문장으로 작성(그 외에는 빈 문자열).
반드시 아래 JSON만 출력(설명·코드펜스 금지):
{"items":[{"id":"<id>","category":"S|T|Ec|En|P","name":"다듬은 변수명","rationale":"근거","aiLinked":true|false,"crossImpact":"연쇄효과 또는 빈문자열"}]}`;
  const usr=`분석 대상: ${state.session.topic||'(미지정)'} / 시간지평: ${TIME_HORIZON}\n변수(JSON):\n`+JSON.stringify(list);
  try{
    const data=await callClaude(sys,usr,4000);
    const json=extractJSON((data.content||[]).map(b=>b.text||'').join(''));
    if(!json||!json.items) throw new Error('AI 응답 파싱 실패');
    let n=0;
    json.items.forEach(it=>{ const v=state.variables.find(x=>x.id===it.id);
      if(v&&STEEP[it.category]){ v.category=it.category; v.aiName=it.name||v.aiName; v.rationale=it.rationale||'';
        v.aiLinked=!!it.aiLinked; v.crossImpact=it.aiLinked?(it.crossImpact||''):''; n++; } });
    save(); renderBoard();
    status.innerHTML=`<div class="notice ok">✅ ${n}개 분류 완료. ⚡ 표시는 AI 연계 변수입니다. 카드를 드래그해 조정하세요.</div>`;
  }catch(err){ console.error(err); status.innerHTML=`<div class="notice warn">⚠ AI 분류 실패: ${esc(err.message)} — 규칙 기반 분류를 사용해 보세요.</div>`; }
}

async function aiSuggestScores(){
  const key=getApiKey(); const out=document.getElementById('evalAi'); if(!key){ openSettings(); return; }
  out.innerHTML=`<div class="notice ai"><span class="spinner"></span> AI가 영향도/불확실성 제안 중…</div>`;
  const list=state.variables.map(v=>({id:v.id,text:v.aiName||v.text,cat:v.category}));
  const sys=`${persona()}시나리오 플래닝 전문가로서, 각 변수에 ${TIME_HORIZON} 기준 사업 영향도(impact)와 불확실성(uncertainty)을 1~5 정수로 제안하세요. JSON만: {"items":[{"id":"..","impact":1-5,"uncertainty":1-5}]}`;
  const usr=`분석 대상: ${state.session.topic||'(미지정)'}\n변수:\n`+JSON.stringify(list);
  try{ const data=await callClaude(sys,usr,2000); const json=extractJSON((data.content||[]).map(b=>b.text||'').join('')); if(!json||!json.items) throw new Error('파싱 실패');
    json.items.forEach(it=>{ const v=state.variables.find(x=>x.id===it.id); if(v){ v.impact=clamp(it.impact); v.uncertainty=clamp(it.uncertainty); } });
    save(); renderEvalTable(); drawMatrix(); out.innerHTML=`<div class="notice ok">✅ 제안값을 채웠습니다. 토론으로 조정하세요(참고용).</div>`;
  }catch(e){ out.innerHTML=`<div class="notice warn">⚠ 실패: ${esc(e.message)}</div>`; }
}
function clamp(n){ n=Math.round(+n||0); return Math.max(1,Math.min(5,n)); }

function drawMatrix(){
  const host=document.getElementById('matrixHost'); if(!host) return;
  const vars=scoredVars(); const W=520,H=480,pad=54;
  const x=u=>pad+(u-1)/4*(W-pad*2); const y=i=>(H-pad)-(i-1)/4*(H-pad*2); const mid=3;
  const seen={}; function jit(v){ const k=v.uncertainty+'_'+v.impact; const n=(seen[k]=(seen[k]||0)+1); const a=n*1.6; return {dx:Math.cos(a)*7*(n>1?1:0),dy:Math.sin(a)*7*(n>1?1:0)}; }
  const pts=vars.map((v,idx)=>{ const j=jit(v); const c=STEEP[v.category]||STEEP.U; return `<g>
    <circle cx="${x(v.uncertainty)+j.dx}" cy="${y(v.impact)+j.dy}" r="13" fill="${c.hex}" fill-opacity="0.9" stroke="#0b0f14" stroke-width="1.5"></circle>
    <text x="${x(v.uncertainty)+j.dx}" y="${y(v.impact)+j.dy+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0f14">${idx+1}</text></g>`; }).join('');
  host.innerHTML=`<svg class="matrix" viewBox="0 0 ${W} ${H}" id="matrixSvg" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#222b35"></rect>

async function callClaude(system,user,maxTokens){
  const res=await fetch('https://api.anthropic.com/v1/messages',{ method:'POST',
    headers:{ 'content-type':'application/json','x-api-key':getApiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model: state.settings.model||'claude-sonnet-4-6', max_tokens:maxTokens||2000, system, messages:[{role:'user',content:user}] }) });
  if(!res.ok){ let m=res.status+' '+res.statusText; try{ const e=await res.json(); if(e.error?.message) m=e.error.message; }catch(_){} throw new Error(m); }
  return res.json();
}
function extractJSON(text){ if(!text) return null; let t=text.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  const s=t.indexOf('{'),e=t.lastIndexOf('}'); if(s>=0&&e>s) t=t.slice(s,e+1); try{ return JSON.parse(t); }catch(_){ return null; } }

function exportMatrixPNG(){
  const svg=document.getElementById('matrixSvg'); if(!svg){ alert('매트릭스를 먼저 표시하세요(Activity II).'); return; }
  const xml=new XMLSerializer().serializeToString(svg); const img=new Image();
  img.onload=()=>{ const scale=2; const cv=document.createElement('canvas'); cv.width=svg.viewBox.baseVal.width*scale; cv.height=svg.viewBox.baseVal.height*scale;
    const ctx=cv.getContext('2d'); ctx.scale(scale,scale); ctx.drawImage(img,0,0); cv.toBlob(b=>downloadBlob(b,fname('matrix','png'))); };
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(xml)));
}
function exportCSV(){
  const head=['카테고리','변수','원문','AI연계','연쇄효과','영향도','불확실성','분류근거'];
  const rows=state.variables.map(v=>[(STEEP[v.category]||STEEP.U).name, v.aiName||'', v.text, v.aiLinked?'Y':'', v.crossImpact||'', v.impact||'', v.uncertainty||'', v.rationale||'']);
  const csv=[head,...rows].map(r=>r.map(c=>`"${(c+'').replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadBlob(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}), fname('variables','csv'));
}
function exportJSON(){ downloadBlob(new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}), fname('session','json')); }

  const w=window.open('','_blank');
  const css=`body{font-family:-apple-system,'Malgun Gothic','Noto Sans KR',sans-serif;color:#111;max-width:920px;margin:0 auto;padding:32px;line-height:1.6}

    table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px} th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top} th{background:#f0f4f8}
    .muted{color:#666} .scn{border:1px solid #ccc;border-radius:8px;padding:12px;margin:8px 0} .sel{border:2px solid #34c77b}

  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>AI 사업기회 도출 리포트</title><style>${css}</style></head><body>
    <button class="noprint" onclick="window.print()" style="float:right;padding:8px 16px;cursor:pointer">🖨 인쇄/PDF</button>
    <h1>AI 사업기회 도출 워크숍 — 개인 리포트</h1>
    <p class="muted">${esc(s.team||'')} · ${esc(s.name||'')} · ${esc(s.title||'')} · 시간지평 ${TIME_HORIZON} · ${new Date().toLocaleDateString('ko-KR')}</p>
    <p><b>분석 대상:</b> ${esc(s.topic||'(미지정)')}</p>

    <h2>Activity I — STEEP 환경 분석</h2>
    ${byCat.map(g=>g.items.length?`<h3>${STEEP[g.k].name}</h3><ul>${g.items.map(v=>`<li>${v.aiLinked?'⚡ ':''}${esc(v.aiName||v.text)} ${v.rationale?`<span class="muted">— ${esc(v.rationale)}</span>`:''}${v.crossImpact?`<br><span class="muted">⚡ 연쇄효과: ${esc(v.crossImpact)}</span>`:''}</li>`).join('')}</ul>`:'').join('')}

    <h2>Activity II — 핵심변수 & 시나리오</h2>
    <table><tr><th>변수</th><th>분류</th><th>영향도</th><th>불확실성</th></tr>
    ${state.variables.filter(v=>v.impact||v.uncertainty).sort((a,b)=>(b.impact+b.uncertainty)-(a.impact+a.uncertainty)).map(v=>`<tr><td>${esc(v.aiName||v.text)}</td><td>${tag(v.category)}</td><td>${v.impact||'-'}</td><td>${v.uncertainty||'-'}</td></tr>`).join('')}</table>

    ${scenarioTitles().map((t,i)=>`<div class="scn ${sc.selected===i?'sel':''}"><b>시나리오 ${i+1}: ${esc(t)}</b>${sc.selected===i?' ✅ 실습 선정':''}<div>${esc(sc.cells[i]||'(미작성)').replace(/\n/g,'<br>')}</div></div>`).join('')}

function handleMerge(files){
  let added=0,done=0; const msg=document.getElementById('mergeMsg');
  const existing=new Set(state.variables.map(v=>(v.text||'').trim()));
  [...files].forEach(file=>{ const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); (d.variables||[]).forEach(v=>{ const t=(v.text||'').trim(); if(!t||existing.has(t))return; existing.add(t);
      state.variables.push({ id:uid(), text:t, category:v.category||'U', aiName:v.aiName||'', rationale:v.rationale||'', aiLinked:!!v.aiLinked, crossImpact:v.crossImpact||'', impact:v.impact||0, uncertainty:v.uncertainty||0, author:v.author||(d.session?.name||'') }); added++; }); }catch(e){ console.warn(e); }
      if(++done===files.length){ save(); if(msg) msg.textContent=` ✅ ${added}개 병합 완료`; render(); } };
    r.readAsText(file); });
}
function importJSON(file){ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.variables) throw new Error('형식 오류');
  if(confirm('현재 세션을 불러온 데이터로 교체할까요?(병합 아님)')){ state=Object.assign(DEFAULT_STATE(),d); state.canvas=Object.assign({asis:{},tobe:{}},d.canvas||{}); state.oppthreat=Object.assign({sel:{},rat:{},insight:''},d.oppthreat||{}); save(); render(); } }catch(e){ alert('불러오기 실패: '+e.message); } }; r.readAsText(file); }

function downloadBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function fname(base,ext){ const t=[state.session.team,state.session.name].filter(Boolean).join('_').replace(/[^\w가-힣]+/g,'_').slice(0,24)||'steep'; return `${t}_${base}_${new Date().toISOString().slice(0,10)}.${ext}`; }

/* ---------- settings modal ---------- */
function openSettings(){
  const cur=getApiKey(); const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h3>⚙ AI 설정 (Claude API)</h3>
    <div class="field"><label class="fl">Anthropic API Key</label><input type="password" id="m_key" value="${esc(cur)}" placeholder="sk-ant-...">
      <div class="hint">키는 이 브라우저에만 저장되며 Anthropic API 직접 호출에만 사용됩니다. 세션 JSON에 포함되지 않습니다.</div></div>
    <div class="field"><label class="fl">모델</label><select id="m_model">
      <option value="claude-sonnet-4-6">claude-sonnet-4-6 (균형·추천)</option>
      <option value="claude-opus-4-8">claude-opus-4-8 (최고 성능)</option>
      <option value="claude-haiku-4-5-20251001">claude-haiku-4-5 (빠름·저비용)</option></select></div>
    <div class="notice">브라우저 직접 호출(<span class="kbd">anthropic-dangerous-direct-browser-access</span>). 세미나/개인용 키 권장.</div>
    <div class="toolbar"><div class="left"><button class="btn ghost" id="m_clear">키 삭제</button></div>
      <div class="right"><button class="btn ghost" id="m_cancel">취소</button><button class="btn primary" id="m_save">저장</button></div></div></div>`;
  document.body.appendChild(bg); document.getElementById('m_model').value=state.settings.model||'claude-sonnet-4-6';
  const close=()=>bg.remove(); bg.addEventListener('click',e=>{ if(e.target===bg) close(); });
  document.getElementById('m_cancel').onclick=close;
  document.getElementById('m_clear').onclick=()=>{ setApiKey(''); close(); render(); };
  document.getElementById('m_save').onclick=()=>{ setApiKey(document.getElementById('m_key').value.trim()); state.settings.model=document.getElementById('m_model').value; save(); close(); render(); };
}

/* ---------- top buttons / boot ---------- */
document.getElementById('btnSettings').onclick=openSettings;
document.getElementById('btnExportAll').onclick=exportJSON;
document.getElementById('btnImport').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=''; };
document.getElementById('mergeInput').onchange=e=>{ if(e.target.files.length) handleMerge(e.target.files); e.target.value=''; };
render();
</script>
